services:
  - type: web
    name: cyberbullying-detection-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python generate_data.py && python train.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
